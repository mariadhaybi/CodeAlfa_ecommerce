 <!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

  <div class="auth-container">
    

<h2>Login</h2>

<form id="loginForm">

  <input
    type="email"
    id="email"
    placeholder="Enter email"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Enter password"
    required
  >

  <button type="submit">
    Login
  </button>

</form>

<p>
  Don't have an account?
  <a href="register.html">Register</a>
</p>

  </div>

  <script src="js/login.js"></script>

</body>
</html>
